name: ClassScheduleNotifier
options:
  bundleIdPrefix: com.billieuphart
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ClassScheduleNotifier:
    type: application
    platform: iOS
    sources:
      - path: ClassScheduleNotifier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billieuphart.ClassScheduleNotifier
        PRODUCT_NAME: ClassScheduleNotifier
        INFOPLIST_KEY_CFBundleDisplayName: 课程提醒
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
