name: GlassSchedule IPA

on:
  push:
    paths:
      - "GlassSchedule/**"
      - ".github/workflows/glass-schedule-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-26
    defaults:
      run:
        working-directory: GlassSchedule
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          # 确保没有残留的 entitlements / Watch 依赖干扰侧载
          rm -f iOS/*.entitlements Widgets/*.entitlements
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project GlassSchedule.xcodeproj -scheme GlassSchedule \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "===== COMPILER ERRORS ====="
              grep -E "error:" build.log | sort -u | head -150
              echo "===== LOG TAIL ====="
              tail -60 build.log
              exit 1
            }
          grep -E "warning:" build.log | sort -u | head -40 || true

      - name: Ad-hoc sign and package sideload IPA
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/GlassSchedule.app
          test -d "$APP"

          # 去掉 Watch（免费 Apple ID / Sideloadly 常因此失败）
          rm -rf "$APP/Watch"

          # 清掉可能残留的付费权限描述
          find "$APP" -name '*.entitlements' -delete || true

          # 先签扩展，再签主 App（ad-hoc），方便 Sideloadly / AltStore 覆盖签名
          if [ -d "$APP/PlugIns" ]; then
            for appex in "$APP"/PlugIns/*.appex; do
              echo "Ad-hoc signing $appex"
              codesign --force --sign - --timestamp=none "$appex"
            done
          fi
          codesign --force --sign - --timestamp=none "$APP"
          codesign -dv --verbose=2 "$APP" || true

          rm -rf Payload GlassSchedule-sideload.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 再次确认没有 Watch
          rm -rf Payload/GlassSchedule.app/Watch
          zip -qry GlassSchedule-sideload.ipa Payload
          ls -lh GlassSchedule-sideload.ipa
          echo "Bundle IDs:"
          plutil -p Payload/GlassSchedule.app/Info.plist | grep -E "CFBundleIdentifier|MinimumOSVersion|CFBundleShortVersionString" || true
          if [ -d Payload/GlassSchedule.app/PlugIns ]; then
            find Payload/GlassSchedule.app/PlugIns -name Info.plist -print -exec plutil -p {} \; | grep CFBundleIdentifier || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GlassSchedule-sideload-ipa
          path: GlassSchedule/GlassSchedule-sideload.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glass-schedule-sideload-${{ github.run_number }}
          name: 玻璃课表 侧载版 IPA ${{ github.run_number }}（v1.0.2）
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: GlassSchedule/GlassSchedule-sideload.ipa
          body: |
            ## 侧载专用包（v1.0.2）
            - Bundle ID：`com.billieuphart.glassschedule`（+ 小组件 `.widgets`）
            - **已去掉 Apple Watch App**（免费证书 App ID 不够时常装不上）
            - **已去掉 App Group / 时效通知等付费权限**
            - 已做 ad-hoc 签名，可用 Sideloadly / AltStore / 爱思助手重签安装
            - 需要 **iOS 26**
            - 侧载时请勾选安装 **Widget / 扩展**，实时活动才显示

            ### Sideloadly 建议
            1. 勾选 *Apple ID* 登录你的账号
            2. 不要删除 `.appex` 扩展
            3. 若仍失败：换「Install after sign」/ 关掉「Live Container」类选项再试
