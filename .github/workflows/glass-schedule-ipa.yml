name: GlassSchedule IPA

on:
  push:
    paths:
      - "GlassSchedule/**"
      - ".github/workflows/glass-schedule-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    defaults:
      run:
        working-directory: GlassSchedule
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: OCR cleanup / grid spatial / weeks / screenshot fixture regressions
        working-directory: .
        run: |
          swift GlassSchedule/Tests/run_ocr_cleanup_tests.swift
          swift GlassSchedule/Tests/run_grid_spatial_tests.swift
          swift GlassSchedule/Tests/run_weeks_parser_tests.swift
          swift GlassSchedule/Tests/run_bug_screenshot_fixtures.swift
          swift GlassSchedule/Tests/run_chaoxing_atroom_tests.swift

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          rm -f iOS/*.entitlements Widgets/*.entitlements
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project GlassSchedule.xcodeproj -scheme GlassSchedule \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "===== COMPILER ERRORS ====="
              grep -E "error:" build.log | sort -u | head -150
              echo "===== LOG TAIL ====="
              tail -60 build.log
              exit 1
            }
          grep -E "warning:" build.log | sort -u | head -40 || true

      - name: Package sideload IPAs (full + lite)
        run: |
          set -euo pipefail
          SRC=build/Build/Products/Release-iphoneos/GlassSchedule.app
          test -d "$SRC"

          package_one() {
            local label="$1"   # full | lite
            local out_ipa="$2"
            local include_plugins="$3"

            rm -rf "_pkg_$label" "Payload" "$out_ipa"
            mkdir -p "_pkg_$label"
            ditto "$SRC" "_pkg_$label/GlassSchedule.app"
            local APP="_pkg_$label/GlassSchedule.app"

            rm -rf "$APP/Watch"
            find "$APP" -name '*.entitlements' -delete || true
            rm -f "$APP"/AppIcon*ipad* "$APP"/AppIcon*~ipad* || true
            plutil -remove 'CFBundleIcons~ipad' "$APP/Info.plist" 2>/dev/null || true

            if [ "$include_plugins" != "yes" ]; then
              rm -rf "$APP/PlugIns"
              # lite 无 Widget/Live Activity：去掉声明，避免部分安装器拒装
              plutil -remove NSSupportsLiveActivities "$APP/Info.plist" 2>/dev/null || true
              plutil -remove NSSupportsLiveActivitiesFrequentUpdates "$APP/Info.plist" 2>/dev/null || true
              echo "Lite: removed PlugIns + Live Activities Info.plist keys"
            fi

            # 与可安装的 v1.0.7/1.0.11 一致：先扩展后主包 ad-hoc 签名（含 DER）
            if [ -d "$APP/PlugIns" ]; then
              for appex in "$APP"/PlugIns/*.appex; do
                [ -d "$appex" ] || continue
                codesign --force --sign - --timestamp=none --generate-entitlement-der "$appex"
              done
            fi
            codesign --force --sign - --timestamp=none --generate-entitlement-der "$APP"
            codesign -dv --verbose=2 "$APP" || true

            chmod +x "$APP/GlassSchedule" || true
            if [ -d "$APP/PlugIns" ]; then
              find "$APP/PlugIns" -type f -name 'GlassScheduleWidgets' -exec chmod +x {} \;
            fi

            # ditto 打 IPA 比 zip 更贴近 Apple 工具链，减少侧载解析异常
            mkdir -p Payload
            ditto "$APP" Payload/GlassSchedule.app
            ditto -c -k --sequesterRsrc --keepParent Payload "$out_ipa"
            ls -lh "$out_ipa"

            echo "---- $label summary ----"
            plutil -p Payload/GlassSchedule.app/Info.plist | grep -E "CFBundleIdentifier|CFBundleDisplayName|MinimumOSVersion|CFBundleShortVersionString|UIBackgroundModes|NSSupportsLiveActivities" || true
            echo "Assets.car=$(stat -f%z Payload/GlassSchedule.app/Assets.car)"
            if [ -d Payload/GlassSchedule.app/PlugIns ]; then
              find Payload/GlassSchedule.app/PlugIns -name Info.plist -exec plutil -p {} \; | grep CFBundleIdentifier || true
            else
              echo "(no PlugIns)"
            fi
            codesign -d --verbose=4 Payload/GlassSchedule.app 2>&1 | head -20 || true
            rm -rf Payload
          }

          package_one full GlassSchedule-sideload.ipa yes
          package_one lite GlassSchedule-sideload-lite.ipa no

      - name: Validate IPAs before publish
        run: |
          chmod +x Scripts/validate-sideload-ipa.sh
          Scripts/validate-sideload-ipa.sh GlassSchedule-sideload.ipa
          Scripts/validate-sideload-ipa.sh GlassSchedule-sideload-lite.ipa --lite

      - uses: actions/upload-artifact@v4
        with:
          name: GlassSchedule-sideload-ipas
          path: |
            GlassSchedule/GlassSchedule-sideload.ipa
            GlassSchedule/GlassSchedule-sideload-lite.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glass-schedule-sideload-${{ github.run_number }}
          name: Classio 侧载版 IPA ${{ github.run_number }}（v1.0.19）
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            GlassSchedule/GlassSchedule-sideload.ipa
            GlassSchedule/GlassSchedule-sideload-lite.ipa
          body: |
            ## Classio 侧载专用包（v1.0.19）

            ### 本版（安装修复）
            - **压缩深浅色/着色 AppIcon**，把 Assets.car 压回可安装量级（对齐 v1.0.11）
            - IPA 改用 `ditto` 打包；lite 去掉 Live Activities 声明
            - 发布前强制 Assets.car ≤ 600KB

            ### 安装（请先试 lite）
            1. **先装 `GlassSchedule-sideload-lite.ipa`**（无小组件，侧载成功率最高）
            2. 先删旧 Classio 再装；需要 **iOS 26+**
            3. 完整版含 Widget/灵动岛，部分免费证书可能装不上

            Bundle ID：`com.billieuphart.glassschedule`
