name: GlassSchedule

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""   # 在这里填你的 Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  GlassSchedule:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared/Core
      - path: Shared/Activity
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: 玻璃课表
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        NSPhotoLibraryUsageDescription: 玻璃课表需要读取照片，按拍摄时间把上课期间拍的板书、PPT 照片归类到对应课程的复习资料中。
        NSPhotoLibraryAddUsageDescription: 玻璃课表会在“照片”中按专业创建文件夹、按课程创建“复习资料”相簿。
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.glassschedule.refresh
          - com.example.glassschedule.photos
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: iOS/GlassSchedule.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.glassschedule]
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.glassschedule
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: GlassScheduleWidgets
      - target: GlassScheduleWatch

  GlassScheduleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared/Core
      - path: Shared/Activity
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: 玻璃课表小组件
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/GlassScheduleWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.glassschedule]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.glassschedule.widgets
        TARGETED_DEVICE_FAMILY: "1"

  GlassScheduleWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared/Core
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: 玻璃课表
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.glassschedule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.glassschedule.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
