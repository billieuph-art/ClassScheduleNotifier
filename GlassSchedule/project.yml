name: GlassSchedule

options:
  bundleIdPrefix: com.billieuphart
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.10"
    CURRENT_PROJECT_VERSION: "11"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  # 侧载友好：仅 App + 小组件（实时活动需要）。不含 Watch、不含 App Group / 时效通知权限。
  GlassSchedule:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared/Core
      - path: Shared/Activity
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Classio
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSPhotoLibraryUsageDescription: Classio 需要读取照片，按拍摄时间把上课期间拍的板书、PPT 照片归类到对应课程的复习资料中。
        NSPhotoLibraryAddUsageDescription: Classio 会在“照片”中按专业创建文件夹、按课程创建“复习资料”相簿。
        # 侧载免费证书通常不含 processing；只用 fetch，避免安装被拒
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - com.billieuphart.glassschedule.refresh
          - com.billieuphart.glassschedule.photos
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billieuphart.glassschedule
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # 侧载包不做自动签名，由 CI 做 ad-hoc 签名后再用 Sideloadly 重签
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - target: GlassScheduleWidgets
        embed: true

  GlassScheduleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared/Core
      - path: Shared/Activity
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Classio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billieuphart.glassschedule.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
